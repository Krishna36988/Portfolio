<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guru Sai Krishna · AI Engineer & Full Stack Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* THE THREE COLORS (60 : 30 : 10). Text and soft borders are tints of these same colors. */
:root{
  --bg:#0F172A;        /* 60% Midnight Navy canvas */
  --surface:#F8FAFC;   /* 30% Alabaster: cards, panels, footer */
  --accent:#D4AF37;    /* 10% Champagne Gold: CTAs, active states, key metrics */
  --on-bg:var(--surface);                                   /* text on the navy canvas */
  --on-bg-soft:color-mix(in srgb,var(--surface) 76%,var(--bg));
  --ink:var(--bg);                                          /* text on alabaster surfaces */
  --ink-soft:color-mix(in srgb,var(--bg) 72%,var(--surface));
  --edge:color-mix(in srgb,var(--surface) 22%,var(--bg));   /* subtle borders on navy */
  --chip:color-mix(in srgb,var(--bg) 9%,var(--surface));    /* tag chips on alabaster */
  --radius:14px;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--on-bg);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{width:min(1120px,100% - 2.5rem);margin-inline:auto}
section{padding:4.5rem 0}
h1,h2,h3{line-height:1.08;margin:0;letter-spacing:-.02em}
h2{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;margin-bottom:2rem}

/* Loader */
#loader{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .45s ease,visibility .45s}
#loader.done{opacity:0;visibility:hidden}
.ld{width:min(260px,70vw);text-align:center}
.ld-mark{width:56px;height:56px;margin:0 auto 1.4rem;border:3px solid var(--edge);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
.ld-bar{height:6px;background:var(--edge);border-radius:9px;overflow:hidden}
.ld-bar i{display:block;height:100%;width:0;background:var(--accent);animation:fill 1.2s cubic-bezier(.6,0,.3,1) forwards}
.ld p{margin:.8rem 0 0;font-size:.9rem;color:var(--on-bg-soft)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fill{to{width:100%}}

/* Nav */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--edge)}
nav{display:flex;align-items:center;justify-content:space-between;height:60px}
nav b{font-weight:800}
nav ul{display:flex;gap:1.4rem;list-style:none;margin:0;padding:0}
nav ul a{text-decoration:none;font-size:.95rem;padding:.3rem 0;border-bottom:2px solid transparent;transition:border-color .2s}
nav ul a:hover{border-color:var(--accent)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.75rem 1.3rem;border-radius:999px;font:inherit;font-weight:600;text-decoration:none;cursor:pointer;border:2px solid var(--accent);transition:background .2s,color .2s}
.btn.primary{background:var(--accent);color:var(--bg)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent);color:var(--bg)}
.btn.sm{padding:.5rem 1rem;font-size:.9rem}

/* Hero */
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:3rem;align-items:center;padding-top:4rem}
.hero h1{font-size:clamp(2.8rem,8vw,5.6rem);font-weight:800}
.roles{display:flex;flex-wrap:wrap;gap:.6rem;margin:1.2rem 0}
.roles span{background:var(--surface);color:var(--ink);padding:.35rem .9rem;border-radius:999px;font-weight:600}
.roles span:first-child{background:var(--accent);color:var(--bg)}
.bio{max-width:56ch;color:var(--on-bg-soft);font-size:1.1rem}
.skills{display:flex;flex-wrap:wrap;gap:.5rem;list-style:none;margin:1.5rem 0 0;padding:0;max-width:60ch}
.skills li{display:inline-flex;align-items:center;gap:.45rem;padding:.35rem .85rem .35rem .6rem;border:1.5px solid var(--edge);border-radius:999px;font-size:.9rem;font-weight:600}
.skills svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.actions{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:1.6rem}
.photo{position:relative;justify-self:center;width:min(340px,80%)}
.photo::before{content:"";position:absolute;inset:14px -14px -14px 14px;background:var(--surface);border-radius:28px}
.photo img{position:relative;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:50% 20%;border-radius:28px;border:3px solid var(--accent);background:var(--surface)}

/* Metrics */
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;padding:0 0 1rem}
.metric{border:1.5px solid var(--edge);border-radius:var(--radius);padding:1.4rem 1.6rem}
.metric strong{display:block;font-size:clamp(2.2rem,5vw,3.4rem);font-weight:800;color:var(--accent);line-height:1}
.metric span{color:var(--on-bg-soft);font-weight:600}

/* Projects */
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.6rem}
.sec-head h2{margin:0}
.grid{display:flex;gap:1.5rem;align-items:flex-start;overflow-x:auto;scroll-snap-type:x proximity;padding:.3rem .2rem 1rem;scrollbar-width:thin;scrollbar-color:var(--accent) var(--edge)}
.grid>.card{flex:0 0 min(86%,360px);scroll-snap-align:start}
.grid.all{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));overflow:visible}
.grid.all>.card{flex:initial}
.card{background:var(--surface);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;border:2px solid var(--surface);transition:border-color .2s}
.card.open{border-color:var(--accent)}
.media{position:relative;background:var(--bg)}
.media>img{width:100%;aspect-ratio:var(--r,16/9);object-fit:cover}
.media.portrait>img{aspect-ratio:4/5;object-fit:contain}
.media>img.thumb{position:absolute;right:.7rem;bottom:.7rem;width:84px;aspect-ratio:4/3;object-fit:cover;border:2px solid var(--accent);border-radius:10px}
.body{padding:1.3rem 1.4rem 1.4rem;display:flex;flex-direction:column;gap:.9rem}
.body h3{font-size:1.4rem}
.body p{margin:0;color:var(--ink-soft)}
.badge{align-self:flex-start;background:var(--accent);color:var(--ink);font-weight:700;font-size:.85rem;padding:.15rem .7rem;border-radius:999px}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;list-style:none;margin:0;padding:0}
.tags li{background:var(--chip);padding:.15rem .7rem;border-radius:999px;font-size:.85rem;font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:.6rem}
.mem{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s ease}
.card.open .mem{grid-template-rows:1fr}
.mem>div{overflow:hidden;min-height:0}
.strip{background:var(--chip);margin:0 1rem 1rem;border-radius:12px;padding:.8rem 0 .6rem}
.strip-bar{display:flex;align-items:center;justify-content:space-between;padding:0 .8rem .6rem;font-weight:600;font-size:.9rem}
.strip-bar div{display:flex;gap:.4rem}
.strip-bar button{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-weight:800;cursor:pointer}
.strip-bar button:hover,.strip-bar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.track-wrap{overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--accent) var(--chip)}
.track{display:flex;gap:.8rem;width:max-content;padding:0 .8rem}
.mem-item{margin:0;width:210px;flex:none}
.mem-item img{width:210px;height:150px;object-fit:cover;border-radius:10px;background:var(--surface)}
.mem-item figcaption{font-size:.85rem;color:var(--ink-soft);padding-top:.35rem}

/* Footer */
footer{background:var(--surface);color:var(--ink);padding:4rem 0 3rem;margin-top:2rem}
footer h2{margin-bottom:.6rem}
footer p{margin:0 0 1.6rem;color:var(--ink-soft);max-width:52ch}
.contact{display:flex;flex-wrap:wrap;gap:.8rem}
.copied{min-height:1.5rem;margin-top:.8rem;font-weight:600;color:var(--ink)}
.fine{margin-top:2.5rem;font-size:.85rem;color:var(--ink-soft)}

.card .btn.ghost,footer .btn.ghost{color:var(--ink);border-color:var(--ink)}
.card .btn.ghost:hover,footer .btn.ghost:hover{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.card :focus-visible,footer :focus-visible,dialog :focus-visible{outline-color:var(--ink)}
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:var(--radius);width:min(940px,94vw);max-height:92vh;overflow:auto}
dialog::backdrop{background:color-mix(in srgb,var(--bg) 82%,transparent)}
.dlg-bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.8rem 1rem}
.dlg-bar b{font-weight:600;font-size:.95rem}
dialog img{width:100%;display:block}
dialog :focus-visible{outline-color:var(--ink)}
@media (max-width:820px){
  .hero{grid-template-columns:1fr;gap:2.4rem}
  .photo{order:-1;width:min(240px,60%)}
  nav ul{gap:.9rem}
  .metrics{grid-template-columns:1fr}
  section{padding:3.2rem 0}
}
@media (max-width:420px){nav b{display:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div id="loader" role="status" aria-live="polite">
  <div class="ld"><div class="ld-mark"></div><div class="ld-bar"><i></i></div><p>Loading portfolio</p></div>
</div>

<header><div class="wrap"><nav aria-label="Primary">
  <b id="navName"></b>
  <ul><li><a href="#top">About</a></li><li><a href="#projects">Projects</a></li><li><a href="#hackathons">Hackathons</a></li><li><a href="#contact">Contact</a></li></ul>
</nav></div></header>

<main id="top">
  <div class="wrap hero" id="hero"></div>
  <div class="wrap metrics" id="metrics" aria-label="Overview"></div>
  <section id="projects"><div class="wrap">
    <div class="sec-head">
      <h2>Projects</h2>
      <button class="btn ghost sm" id="showAll" type="button" aria-expanded="false" aria-controls="projectGrid"></button>
    </div>
    <div class="grid" id="projectGrid"></div>
  </div></section>
  <section id="hackathons"><div class="wrap">
    <div class="sec-head">
      <h2>Hackathons</h2>
      <button class="btn ghost sm" id="showAllHack" type="button" aria-expanded="false" aria-controls="hackGrid"></button>
    </div>
    <div class="grid" id="hackGrid"></div>
  </div></section>
</main>

<footer id="contact"><div class="wrap">
  <h2>Let’s build something</h2>
  <p id="contactLine"></p>
  <div class="contact" id="contactLinks"></div>
  <div class="copied" id="copied" role="status" aria-live="polite"></div>
  <div class="fine" id="fine"></div>
</div></footer>

<dialog id="certDialog" aria-label="Certificate">
  <div class="dlg-bar"><b id="certCaption"></b><button class="btn primary sm" id="certClose" type="button">Close</button></div>
  <img id="certImg" alt="Certificate">
</dialog>

// Skill icons (inline SVG, drawn in the accent color)
const ICONS={
 code:'<path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/>',
 terminal:'<path d="m4 17 6-6-6-6"/><path d="M12 19h8"/>',
 network:'<circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="5" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="m7.2 11 9.6-4.8M7.2 13l9.6 4.8"/>',
 cpu:'<rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',
 sparkles:'<path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"/><path d="M19 3v4M17 5h4"/>',
 eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
 layers:'<path d="m12 2 10 5-10 5L2 7Z"/><path d="m2 12 10 5 10-5"/><path d="m2 17 10 5 10-5"/>',
 globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20Z"/>',

 box:'<path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',

 git:'<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="9" r="2.5"/><path d="M6 8.5v7"/><path d="M18 11.5c0 4-6 3-12 4.5"/>'
};

   <a class="btn primary" href="#projects">View projects</a>

 </div>
 <div class="photo"><img src="${esc(D.profile.photo)}" alt="${esc(D.profile.photoAlt)}"></div>`;

// Metrics, counted from the arrays
// Third value is an optional suffix shown after the count (e.g. "+" for "5+"). Use "" for none.
const metrics=[["Projects",D.projects.length,""],["Hackathons",D.hackathons.length,""],["Certificates",D.certificates.length,"+"]];
$("#metrics").innerHTML=metrics.map(([l,n,x])=>`<div class="metric"><strong data-n="${n}" data-x="${x}">0${x}</strong><span>${l}</span></div>`).join("");
function countUp(){
  document.querySelectorAll(".metric strong").forEach(el=>{
    const n=+el.dataset.n,x=el.dataset.x||""; if(reduce||n===0){el.textContent=n+x;return}
    const t0=performance.now(),dur=900;
    (function step(t){const p=Math.min((t-t0)/dur,1);el.textContent=Math.round(n*(1-Math.pow(1-p,3)))+(p>=1?x:"");if(p<1)requestAnimationFrame(step)})(t0);
  });
}

// Cards (shared by Projects and Hackathons)
const certs={};
function cardHTML(p,key){
  if(p.certificate)certs[key]=p.certificate;
  const hasMem=p.memories&&p.memories.length;
  const items=hasMem?p.memories.map(m=>`<figure class="mem-item"><img src="${esc(m.img)}" alt="${esc(m.caption)}" loading="lazy"><figcaption>${esc(m.caption)}</figcaption></figure>`).join(""):"";
  const links=[p.demo&&`<a class="btn primary sm" href="${esc(p.demo)}" target="_blank" rel="noopener">Live demo</a>`,
               p.repo&&`<a class="btn ghost sm" href="${esc(p.repo)}" target="_blank" rel="noopener">Source code</a>`,
               p.certificate&&`<button class="btn ghost sm cert-btn" type="button" data-cert="${key}">Certificate</button>`,
               hasMem&&`<button class="btn ghost sm toggle" aria-expanded="false" aria-controls="mem-${key}">Team &amp; Memories</button>`].filter(Boolean).join("");
  return `<article class="card">
   <div class="media${p.portrait?" portrait":""}"${p.ratio?` style="--r:${esc(p.ratio)}"`:""}>
    <img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy">
    ${p.thumb?`<img class="thumb" src="${esc(p.thumb)}" alt="Team photo from ${esc(p.title)}" loading="lazy">`:""}
   </div>
   <div class="body">
    ${p.result?`<span class="badge">${esc(p.result)}${p.year?", "+esc(p.year):""}</span>`:""}
    <h3>${esc(p.title)}</h3>
    <p>${esc(p.summary)}</p>
    <ul class="tags">${p.stack.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
    <div class="links">${links}</div>
   </div>
   ${hasMem?`<div class="mem" id="mem-${key}"><div><div class="strip" role="region" aria-label="${esc(p.title)} team photos">
     <div class="strip-bar"><span>Team &amp; Memories</span><div>
      <button class="prev" aria-label="Previous photos">‹</button>
      <button class="play" aria-pressed="false" aria-label="Pause slideshow">❚❚</button>
      <button class="next" aria-label="Next photos">›</button></div></div>
     <div class="track-wrap" tabindex="0"><div class="track">${items}${items.replace(/<img /g,'<img aria-hidden="true" ').replace(/<figure /g,'<figure aria-hidden="true" ')}</div></div>
   </div></div></div>`:""}
  </article>`}
const renderCards=(list,sel,key)=>{$(sel).innerHTML=list.map((p,i)=>cardHTML(p,key+i)).join("")};
renderCards(D.projects,"#projectGrid","p");
renderCards(D.hackathons,"#hackGrid","h");

// Memory strips: slide left to right, pause on hover/focus/button, manual scroll works
const strips=[];
document.querySelectorAll(".card").forEach(card=>{
  const tw=card.querySelector(".track-wrap"); if(!tw)return;
  const s={card,tw,paused:reduce,hover:false,focus:false};
  const playBtn=card.querySelector(".play");
  const sync=()=>{playBtn.setAttribute("aria-pressed",s.paused);playBtn.textContent=s.paused?"▶":"❚❚";playBtn.setAttribute("aria-label",s.paused?"Play slideshow":"Pause slideshow")};
  sync();
  card.querySelector(".toggle").addEventListener("click",e=>{
    const open=card.classList.toggle("open");e.currentTarget.setAttribute("aria-expanded",open);
    if(open) requestAnimationFrame(()=>{tw.scrollLeft=tw.scrollWidth/2-tw.clientWidth/2});
  });
  playBtn.addEventListener("click",()=>{s.paused=!s.paused;sync()});
  const half=()=>tw.scrollWidth/2;
  card.querySelector(".prev").addEventListener("click",()=>tw.scrollBy({left:-230,behavior:"smooth"}));
  card.querySelector(".next").addEventListener("click",()=>tw.scrollBy({left:230,behavior:"smooth"}));
  tw.addEventListener("mouseenter",()=>s.hover=true);tw.addEventListener("mouseleave",()=>s.hover=false);
  card.querySelector(".strip").addEventListener("focusin",()=>s.focus=true);
  card.querySelector(".strip").addEventListener("focusout",()=>s.focus=false);
  tw.addEventListener("touchstart",()=>s.hover=true,{passive:true});
  tw.addEventListener("touchend",()=>setTimeout(()=>s.hover=false,1500),{passive:true});
  s.half=half;strips.push(s);
});
(function loop(){
  strips.forEach(s=>{
    if(!s.card.classList.contains("open")||s.paused||s.hover||s.focus)return;
    const h=s.half(); if(!h)return;
    s.tw.scrollLeft-=0.6;                 // decreasing scrollLeft moves content left to right
    if(s.tw.scrollLeft<=1)s.tw.scrollLeft+=h;
  });
  requestAnimationFrame(loop);
})();

// Row by default, "Show all" switches to a full grid (button hides until there are 2+ items)
function setupShowAll(gridSel,btnSel,list,noun){
  const grid=$(gridSel),btn=$(btnSel);
  const label=a=>a?"Show less":"Show all "+noun+" ("+list.length+")";
  btn.textContent=label(false);
  if(list.length<2)btn.hidden=true;
  btn.addEventListener("click",()=>{
    const all=grid.classList.toggle("all");
    btn.textContent=label(all);btn.setAttribute("aria-expanded",all);
    if(!all)grid.scrollLeft=0;
  });
}
setupShowAll("#projectGrid","#showAll",D.projects,"projects");
setupShowAll("#hackGrid","#showAllHack",D.hackathons,"hackathons");

$("#copyBtn").addEventListener("click",async()=>{
  let ok=false;
  try{await navigator.clipboard.writeText(C.email);ok=true}catch(e){
    try{const t=document.createElement("textarea");t.value=C.email;document.body.appendChild(t);t.select();ok=document.execCommand("copy");t.remove()}catch(_){}
  }
  $("#copied").textContent=ok?"Email copied to clipboard":"Copy failed. Select the address and copy it manually.";
  setTimeout(()=>$("#copied").textContent="",2500);
});
